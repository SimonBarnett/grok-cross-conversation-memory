[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-cross-conversation-memory"
version = "0.2.0"
description = "Persistent memory across separate Grok conversations"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
